<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Libertalia - Mar 0.7 Costa Orgánica</title>

  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

  <script>
    /* =========================================================
       AGUA EXPERIMENTAL - LIBERTALIA
       ========================================================= */

    AFRAME.registerShader('libertalia-water', {
      schema: {
        time:       {type: 'time', is: 'uniform'},
        deepColor:  {type: 'color', is: 'uniform', default: '#063c52'},
        waterColor: {type: 'color', is: 'uniform', default: '#087d91'},
        foamColor:  {type: 'color', is: 'uniform', default: '#bce7df'}
      },

      vertexShader: `
  uniform float time;

  varying vec3 vWorldPosition;
  varying vec3 vNormal;
  varying float vWave;

  void main() {

    vec3 pos = position;
    float t = time * 0.001;

    /*
       ==================================================
       LIBERTALIA - MAR 0.2
       Oleaje orgánico multicapa
       ==================================================
    */

    // Oleaje principal.
    float wave1 =
      sin(pos.x * 0.22 + t * 1.10) * 0.16;

    float wave2 =
      sin(pos.y * 0.31 - t * 0.85) * 0.10;

    float wave3 =
      sin((pos.x + pos.y) * 0.16 + t * 0.55) * 0.07;


    /*
       Ondas secundarias diagonales.

       Son pequeñas deliberadamente:
       no queremos más altura, sino romper
       la regularidad del patrón anterior.
    */

    float phase4 =
      pos.x * 0.37 -
      pos.y * 0.23 +
      t * 0.73;

    float wave4 =
      sin(phase4) * 0.035;


    float phase5 =
      pos.x * 0.13 +
      pos.y * 0.41 -
      t * 0.47;

    float wave5 =
      sin(phase5) * 0.025;


    /*
       Modulación lenta.

       Hace que el oleaje secundario gane
       y pierda ligeramente intensidad
       según la zona y el momento.
    */

    float modulation =
      0.75 +
      0.25 *
      sin(
        pos.x * 0.045 +
        pos.y * 0.035 +
        t * 0.18
      );


    float wave =
        wave1
      + wave2
      + wave3
      + (wave4 + wave5) * modulation;


    pos.z += wave;


    vec4 world =
      modelMatrix * vec4(pos, 1.0);

    vWorldPosition = world.xyz;
    vWave = wave;


    /*
       ==================================================
       NORMAL APROXIMADA
       ==================================================

       Incluimos las nuevas ondas para que
       también afecten al Fresnel y al brillo.
    */

    float dx =
        0.22 * 0.16 *
        cos(pos.x * 0.22 + t * 1.10)

      + 0.16 * 0.07 *
        cos((pos.x + pos.y) * 0.16 + t * 0.55)

      + 0.37 * 0.035 *
        cos(phase4) * modulation

      + 0.13 * 0.025 *
        cos(phase5) * modulation;


    float dy =
        0.31 * 0.10 *
        cos(pos.y * 0.31 - t * 0.85)

      + 0.16 * 0.07 *
        cos((pos.x + pos.y) * 0.16 + t * 0.55)

      - 0.23 * 0.035 *
        cos(phase4) * modulation

      + 0.41 * 0.025 *
        cos(phase5) * modulation;


    vec3 localNormal =
      normalize(
        vec3(-dx, -dy, 1.0)
      );


    vNormal =
      normalize(
        mat3(modelMatrix) *
        localNormal
      );


    gl_Position =
      projectionMatrix *
      modelViewMatrix *
      vec4(pos, 1.0);
  }
` ,

      fragmentShader: `
  precision mediump float;

  uniform vec3 deepColor;
  uniform vec3 waterColor;
  uniform vec3 foamColor;

  varying vec3 vWorldPosition;
  varying vec3 vNormal;
  varying float vWave;

  float coastRadius(float a) {
    return 8.90
      + sin(a * 3.0 + 0.45) * 0.42
      + sin(a * 5.0 - 1.10) * 0.23
      + sin(a * 8.0 + 2.00) * 0.12;
  }

  void main() {
    vec3 N = normalize(vNormal);
    vec3 V = normalize(cameraPosition - vWorldPosition);

    vec2 islandCenter = vec2(0.0, -5.0);
    vec2 rel = vWorldPosition.xz - islandCenter;
    float rawDistance = length(rel);
    float angle = atan(rel.y, rel.x);
    float coast = coastRadius(angle);
    float coastDistance = rawDistance - coast;

    /* Gradación costera: agua muy clara sobre arena -> turquesa -> océano. */
    float shelfFactor = smoothstep(0.15, 7.2, coastDistance);
    float lagoonFactor = smoothstep(0.15, 3.2, coastDistance);

    vec3 sandWater = vec3(0.25, 0.82, 0.75);
    vec3 turquoise = vec3(0.04, 0.57, 0.63);

    float waveTint = clamp(vWave * 1.8 + 0.5, 0.0, 1.0);
    vec3 normalWater = mix(deepColor, waterColor, waveTint);
    vec3 coastalWater = mix(sandWater, turquoise, lagoonFactor);
    vec3 baseWater = mix(coastalWater, normalWater, shelfFactor);

    float fresnel = pow(1.0 - max(dot(N, V), 0.0), 3.0);
    float skyAmount = clamp(V.y * 0.5 + 0.5, 0.0, 1.0);
    vec3 horizon = vec3(0.95, 0.55, 0.38);
    vec3 sky = vec3(0.35, 0.58, 0.72);
    vec3 reflectedSky = mix(horizon, sky, skyAmount);
    vec3 color = mix(baseWater, reflectedSky, fresnel * 0.68);

    vec3 lightDir = normalize(vec3(-0.4, 1.0, 0.25));
    vec3 H = normalize(lightDir + V);
    float specular = pow(max(dot(N, H), 0.0), 80.0);
    color += foamColor * specular * 0.72;

    float crest = smoothstep(0.18, 0.32, vWave);
    color += foamColor * crest * 0.07;

    float shallowGlow = 1.0 - shelfFactor;
    color += vec3(0.025, 0.07, 0.055) * shallowGlow;

    /*
       LIBERTALIA 0.7 - ESPUMA ORGÁNICA
       La línea sigue la misma costa irregular que la geometría.
       Dos escalas de ruido trigonométrico rompen la banda continua.
       La ola desplaza ligeramente el borde para simular avance/retroceso.
    */
    float alongCoast =
        sin(angle * 11.0 + vWorldPosition.x * 0.55) * 0.50
      + sin(angle * 19.0 - vWorldPosition.z * 0.43) * 0.28
      + sin(vWorldPosition.x * 1.35 + vWorldPosition.z * 0.92) * 0.22;

    float movingEdge = coastDistance - vWave * 0.75;
    float foamInner = smoothstep(-0.03, 0.10, movingEdge);
    float foamOuter = 1.0 - smoothstep(0.48, 0.92, movingEdge);
    float foamBand = foamInner * foamOuter;

    float breakup = smoothstep(-0.34, 0.38, alongCoast + vWave * 2.0);
    float lace = 0.62 + 0.38 * smoothstep(-0.08, 0.22, vWave);
    float shoreFoam = foamBand * mix(0.28, 1.0, breakup) * lace;

    /* Segunda línea muy tenue detrás de la rompiente. */
    float washInner = smoothstep(0.62, 0.82, movingEdge);
    float washOuter = 1.0 - smoothstep(1.02, 1.42, movingEdge);
    float wash = washInner * washOuter * smoothstep(-0.15, 0.45, -alongCoast);

    vec3 shoreFoamColor = vec3(0.91, 0.99, 0.96);
    color = mix(color, shoreFoamColor, clamp(shoreFoam * 0.84 + wash * 0.24, 0.0, 0.90));

    gl_FragColor = vec4(color, 0.95);
  }
`
    });


    /* =========================================================
       LOCOMOCIÓN QUEST
       ========================================================= */

    AFRAME.registerComponent('quest-locomotion', {
      init: function () {
        this.axis = [0, 0];

        this.el.addEventListener('thumbstickmoved', (event) => {
          this.axis = [
            event.detail.x,
            event.detail.y
          ];
        });
      },

      tick: function (time, delta) {

        const rig =
          document.querySelector('#rig');

        const camera =
          document.querySelector('#camera');

        if (!rig || !camera) return;

        const x =
          -(this.axis[0] || 0);

        const y =
          -(this.axis[1] || 0);

        if (
          Math.abs(x) < 0.15 &&
          Math.abs(y) < 0.15
        ) return;

        const direction =
          new THREE.Vector3();

        camera.object3D
          .getWorldDirection(direction);

        direction.y = 0;
        direction.normalize();

        const right =
          new THREE.Vector3();

        right
          .crossVectors(
            direction,
            new THREE.Vector3(0, 1, 0)
          )
          .normalize();

        const speed =
          2.0 * (delta / 1000);

        rig.object3D.position
          .addScaledVector(
            direction,
            -y * speed
          );

        rig.object3D.position
          .addScaledVector(
            right,
            x * speed
          );
      }
    });


    /* =========================================================
       GIRO SUAVE
       ========================================================= */

    AFRAME.registerComponent('smooth-turn', {

      init: function () {

        this.turnX = 0;

        this.el.addEventListener(
          'thumbstickmoved',
          (event) => {

            this.turnX =
              event.detail.x || 0;
          }
        );
      },

      tick: function (time, delta) {

        if (
          Math.abs(this.turnX) < 0.15
        ) return;

        const rig =
          document.querySelector('#rig');

        if (!rig) return;

        const turnSpeed = 180;

        const amount =
          -this.turnX *
          turnSpeed *
          (delta / 1000);

        rig.object3D.rotation.y +=
          THREE.MathUtils.degToRad(amount);
      }
    });

  </script>
</head>

<body>

<a-scene>

  <!-- ===============================================
       LIBERTALIA 0.7 - ISLA ORGÁNICA DE PENDIENTE CONTINUA
       ===============================================
       Una sola malla radial sustituye los cilindros escalonados.
       El perfil desciende suavemente desde tierra firme hasta
       una plataforma de arena sumergida bajo el mar.
  -->

  <a-entity id="smoothIsland" position="0 0 -5"></a-entity>

  <script>
    AFRAME.registerComponent('smooth-island', {
      init: function () {
        const THREE = AFRAME.THREE;
        const radialSegments = 128;
        const rings = 32;
        const maxRadius = 13.8;
        const positions = [];
        const indices = [];

        // Misma función de silueta usada conceptualmente por el shader del agua.
        function coastRadius(a) {
          return 8.90
            + Math.sin(a * 3.0 + 0.45) * 0.42
            + Math.sin(a * 5.0 - 1.10) * 0.23
            + Math.sin(a * 8.0 + 2.00) * 0.12;
        }

        function heightAt(r, a) {
          const coast = coastRadius(a);
          const inner = coast - 3.05;
          const outerShelf = coast + 3.55;

          if (r < inner) {
            const x = r / Math.max(inner, 0.1);
            return 0.03 + 0.30 * (1.0 - x * x);
          }
          if (r < coast) {
            const x = (r - inner) / (coast - inner);
            const e = x * x * (3.0 - 2.0 * x);
            return 0.03 * (1.0 - e) + (-0.70) * e;
          }
          if (r < outerShelf) {
            const x = (r - coast) / (outerShelf - coast);
            const e = x * x * (3.0 - 2.0 * x);
            return -0.70 * (1.0 - e) + (-1.58) * e;
          }
          const x = Math.min((r - outerShelf) / 1.25, 1.0);
          return -1.58 - 0.18 * x;
        }

        for (let ring = 0; ring <= rings; ring++) {
          const baseR = maxRadius * ring / rings;
          for (let i = 0; i <= radialSegments; i++) {
            const a = Math.PI * 2 * i / radialSegments;
            // La deformación crece hacia la costa; el centro queda estable.
            const coast = coastRadius(a);
            const coastDelta = coast - 8.90;
            const influence = Math.min(baseR / 7.0, 1.0);
            const r = baseR + coastDelta * influence;
            positions.push(Math.cos(a) * r, heightAt(r, a), Math.sin(a) * r);
          }
        }

        const row = radialSegments + 1;
        for (let ring = 0; ring < rings; ring++) {
          for (let i = 0; i < radialSegments; i++) {
            const a = ring * row + i;
            const b = a + row;
            indices.push(a, b, a + 1, b, b + 1, a + 1);
          }
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        geometry.setIndex(indices);
        geometry.computeVertexNormals();

        const material = new THREE.MeshStandardMaterial({
          color: new THREE.Color('#e3cb96'),
          roughness: 1.0,
          metalness: 0.0,
          side: THREE.DoubleSide
        });

        this.el.setObject3D('mesh', new THREE.Mesh(geometry, material));
      }
    });

    document.querySelector('#smoothIsland').setAttribute('smooth-island', '');
  </script>

  <!-- Cubo original -->

  <a-box
    position="0 1 -4"
    width="1"
    height="2"
    depth="1"
    color="#8B4513">
  </a-box>


  <!-- Esfera original -->

  <a-sphere
    position="2 1 -5"
    radius="0.75"
    color="#D8B46A">
  </a-sphere>


  <!-- ===============================================
       MAR EXPERIMENTAL
       ===============================================

       Es un plano subdividido porque necesitamos
       suficientes vértices para deformarlo y crear olas.
  -->

  <a-plane
    id="ocean"
    position="0 -0.72 -5"
    rotation="-90 0 0"

    width="160"
    height="160"

    segments-width="100"
    segments-height="100"

    material="
      shader: libertalia-water;
      deepColor: #063c52;
      waterColor: #087d91;
      foamColor: #d7f4ee;
      side: double;
      transparent: true">
  </a-plane>


  <!-- ===============================================
       ROCAS
       =============================================== -->

  <a-dodecahedron
    position="-7 0.6 -7"
    radius="2.2"
    scale="1 1.4 0.8"
    color="#55514A">
  </a-dodecahedron>

  <a-dodecahedron
    position="-6.5 0.3 -3"
    radius="1.5"
    scale="1.2 0.9 1"
    color="#666057">
  </a-dodecahedron>

  <a-dodecahedron
    position="7 0.7 -7"
    radius="2.4"
    scale="0.9 1.5 0.8"
    color="#504D48">
  </a-dodecahedron>

  <a-dodecahedron
    position="6.5 0.25 -2.5"
    radius="1.4"
    scale="1.3 0.8 1"
    color="#696158">
  </a-dodecahedron>

  <a-dodecahedron
    position="-4 0.15 -11"
    radius="1.2"
    scale="1.5 0.7 1"
    color="#5B5650">
  </a-dodecahedron>


  <!-- ===============================================
       PALMERA
       =============================================== -->

  <a-entity
    position="3 0 -7"
    rotation="0 0 -7">

    <a-cylinder
      position="0 2 0"
      radius="0.22"
      height="4"
      segments-radial="8"
      color="#76543A">
    </a-cylinder>

    <a-entity position="0 4 0">

      <a-cone
        position="0.9 0 0"
        rotation="0 0 -90"
        radius-bottom="0.55"
        radius-top="0.05"
        height="2.2"
        color="#376B3A">
      </a-cone>

      <a-cone
        position="-0.9 0 0"
        rotation="0 0 90"
        radius-bottom="0.55"
        radius-top="0.05"
        height="2.2"
        color="#376B3A">
      </a-cone>

      <a-cone
        position="0 0 -0.9"
        rotation="-90 0 0"
        radius-bottom="0.55"
        radius-top="0.05"
        height="2.2"
        color="#315F35">
      </a-cone>

      <a-cone
        position="0 0 0.9"
        rotation="90 0 0"
        radius-bottom="0.55"
        radius-top="0.05"
        height="2.2"
        color="#315F35">
      </a-cone>

    </a-entity>
  </a-entity>


  <!-- ===============================================
       CIELO E ILUMINACIÓN
       =============================================== -->

  <a-sky color="#E89A68"></a-sky>

  <a-light
    type="ambient"
    color="#FFD7B0"
    intensity="0.7">
  </a-light>

  <a-light
    type="directional"
    color="#FFF0D0"
    intensity="1.2"
    position="-4 8 2">
  </a-light>


  <!-- ===============================================
       JUGADOR VR
       =============================================== -->

  <a-entity
    id="rig"
    position="0 0 0">

    <a-camera
      id="camera"
      position="0 1.6 0"
      look-controls>
    </a-camera>

    <a-entity
      id="leftHand"
      hand-controls="hand: left"
      quest-locomotion>
    </a-entity>

    <a-entity
      id="rightHand"
      hand-controls="hand: right"
      smooth-turn>
    </a-entity>

  </a-entity>

</a-scene>

</body>
</html>
