<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hispaniola II - Prueba WebXR</title>

  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>
<script>
AFRAME.registerComponent('quest-locomotion', {
  init: function () {
    this.axis = [0, 0];

    this.el.addEventListener('thumbstickmoved', (event) => {
  this.axis = [event.detail.x, event.detail.y];
});
  },

  tick: function (time, delta) {
    const rig = document.querySelector('#rig');
    const camera = document.querySelector('#camera');

    if (!rig || !camera) return;

    const x = -(this.axis[0] || 0);
const y = -(this.axis[1] || 0);

    if (Math.abs(x) < 0.15 && Math.abs(y) < 0.15) return;

    const direction = new THREE.Vector3();
    camera.object3D.getWorldDirection(direction);
    direction.y = 0;
    direction.normalize();

    const right = new THREE.Vector3();
    right.crossVectors(direction, new THREE.Vector3(0, 1, 0)).normalize();

    const speed = 2.0 * (delta / 1000);

    rig.object3D.position.addScaledVector(direction, -y * speed);
    rig.object3D.position.addScaledVector(right, x * speed);
  }
}); AFRAME.registerComponent('smooth-turn', {
  init: function () {
    this.turnX = 0;

    this.el.addEventListener('thumbstickmoved', (event) => {
      this.turnX = event.detail.x || 0;
    });
  },

  tick: function (time, delta) {
    if (Math.abs(this.turnX) < 0.15) return;

    const rig = document.querySelector('#rig');
    if (!rig) return;

    const turnSpeed = 180; // grados por segundo
    const amount = -this.turnX * turnSpeed * (delta / 1000);

    rig.object3D.rotation.y += THREE.MathUtils.degToRad(amount);
  }
});
      </script>
<body>

  <a-scene>
    
    <!-- Suelo -->
    <!-- Isla / playa -->
<a-cylinder
  position="0 -0.35 -5"
  radius="9"
  height="0.7"
  segments-radial="12"
  color="#D8BE83">
</a-cylinder>

<!-- Zona elevada de arena -->
<a-cylinder
  position="-2 -0.15 -6"
  radius="6"
  height="0.35"
  segments-radial="10"
  scale="1.25 1 0.75"
  color="#E2C98E">
</a-cylinder>

    <!-- Nuestro glorioso primer cubo 😂 -->
    <a-box
      position="0 1 -4"
      width="1"
      height="2"
      depth="1"
      color="#8B4513">
    </a-box>

    <!-- Una esfera para comprobar profundidad -->
    <a-sphere
      position="2 1 -5"
      radius="0.75"
      color="#D8B46A">
    </a-sphere>

    <!-- Una especie de mar provisional -->
    <!-- Mar -->
<a-circle
  position="0 -0.72 -5"
  rotation="-90 0 0"
  radius="80"
  segments="64"
  color="#176D83"
  material="roughness: 0.35; metalness: 0.15">
</a-circle>
    <!-- Rocas de la cala -->
<a-dodecahedron
  position="-7 0.6 -7"
  radius="2.2"
  scale="1 1.4 0.8"
  color="#55514A">
</a-dodecahedron>

<a-dodecahedron
  position="-6.5 0.3 -3"
  radius="1.5"
  scale="1.2 0.9 1"
  color="#666057">
</a-dodecahedron>

<a-dodecahedron
  position="7 0.7 -7"
  radius="2.4"
  scale="0.9 1.5 0.8"
  color="#504D48">
</a-dodecahedron>

<a-dodecahedron
  position="6.5 0.25 -2.5"
  radius="1.4"
  scale="1.3 0.8 1"
  color="#696158">
</a-dodecahedron>

<a-dodecahedron
  position="-4 0.15 -11"
  radius="1.2"
  scale="1.5 0.7 1"
  color="#5B5650">
</a-dodecahedron>

    <!-- Primera palmera de La Cala -->
<a-entity position="3 0 -7" rotation="0 0 -7">

  <!-- Tronco -->
  <a-cylinder
    position="0 2 0"
    radius="0.22"
    height="4"
    segments-radial="8"
    color="#76543A">
  </a-cylinder>

  <!-- Copa -->
  <a-entity position="0 4 0">

    <a-cone
      position="0.9 0 0"
      rotation="0 0 -90"
      radius-bottom="0.55"
      radius-top="0.05"
      height="2.2"
      color="#376B3A">
    </a-cone>

    <a-cone
      position="-0.9 0 0"
      rotation="0 0 90"
      radius-bottom="0.55"
      radius-top="0.05"
      height="2.2"
      color="#376B3A">
    </a-cone>

    <a-cone
      position="0 0 -0.9"
      rotation="-90 0 0"
      radius-bottom="0.55"
      radius-top="0.05"
      height="2.2"
      color="#315F35">
    </a-cone>

    <a-cone
      position="0 0 0.9"
      rotation="90 0 0"
      radius-bottom="0.55"
      radius-top="0.05"
      height="2.2"
      color="#315F35">
    </a-cone>

  </a-entity>
</a-entity>

    <!-- Cielo -->
    <a-sky color="#E89A68"></a-sky>
    <a-light
  type="ambient"
  color="#FFD7B0"
  intensity="0.7">
</a-light>

<a-light
  type="directional"
  color="#FFF0D0"
  intensity="1.2"
  position="-4 8 2">
</a-light>

  <!-- Jugador VR -->
<a-entity id="rig" position="0 0 0">

  <a-camera
    id="camera"
    position="0 1.6 0"
    look-controls>
  </a-camera>

  <a-entity
  id="leftHand"
  hand-controls="hand: left"
  quest-locomotion>
</a-entity>

  <a-entity
  id="rightHand"
  hand-controls="hand: right"
  smooth-turn>
</a-entity>

</a-entity>

  </a-scene>

</body>
</html>
