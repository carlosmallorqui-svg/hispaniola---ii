<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Libertalia — Jungla, cascada y antorchas</title>

  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

  <script>
    /* =========================================================
       AGUA EXPERIMENTAL - LIBERTALIA
       ========================================================= */


    /* =========================================================
       CIELO 1.0 - ATARDECER DE LIBERTALIA
       Gradiente atmosférico + sol + nubes procedurales ligeras.
       Preparado para evolucionar después al ciclo día/noche.
       ========================================================= */
    AFRAME.registerShader('libertalia-sky', {
      schema: {
        time: {type: 'time', is: 'uniform'},
        phase: {type: 'number', is: 'uniform', default: 0.75}
      },

      vertexShader: `
        varying vec3 vDir;
        void main() {
          vDir = normalize(position);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,

      fragmentShader: `
        precision mediump float;
        uniform float time;
        uniform float phase;
        varying vec3 vDir;
        #define PI 3.14159265359

        float hash21(vec2 p) {
          p = fract(p * vec2(123.34,456.21));
          p += dot(p,p+45.32);
          return fract(p.x*p.y);
        }

        void main() {
          vec3 d=normalize(vDir);
          float p=fract(phase);
          float a=(p-0.25)*2.0*PI;
          vec3 sunDir=normalize(vec3(-cos(a)*0.72,sin(a),-0.69));
          vec3 moonDir=-sunDir;
          float sh=sunDir.y;
          float day=smoothstep(-0.12,0.16,sh);
          float tw=1.0-smoothstep(-0.10,0.30,abs(sh));
          float y=clamp(d.y,0.0,1.0);

          vec3 night=mix(vec3(0.035,0.075,0.15),vec3(0.008,0.018,0.060),smoothstep(0.0,0.78,y));
          vec3 daylight=mix(vec3(0.43,0.68,0.86),vec3(0.075,0.28,0.62),smoothstep(0.0,0.78,y));
          vec3 sky=mix(night,daylight,day);

          float az=max(dot(normalize(vec3(d.x,0.04,d.z)),
                           normalize(vec3(sunDir.x,0.04,sunDir.z))),0.0);
          float warm=tw*pow(az,2.2)*(1.0-smoothstep(0.05,0.55,y));
          sky=mix(sky,vec3(1.0,0.31,0.075),warm*0.68);

          float sd=max(dot(d,sunDir),0.0);
          sky+=vec3(1.0,0.38,0.10)*pow(sd,42.0)*day*(0.18+tw*0.38);

          /* Luna */
          float md=max(dot(d,moonDir),0.0);
          float mv=1.0-smoothstep(-0.05,0.12,sh);
          sky+=vec3(0.40,0.48,0.65)*pow(md,70.0)*mv*0.35;

          /* Nubes móviles */
          vec2 cp=d.xz/max(d.y+0.34,0.16);
          cp*=1.15;
          float anim=time*0.000025;
          float n=sin(cp.x*2.3+cp.y*1.4+anim*2.0)*0.50+
                  sin(cp.x*4.1-cp.y*2.7-anim*1.35)*0.32+
                  sin((cp.x+cp.y)*6.2+anim*0.82)*0.18;
          float clouds=smoothstep(0.34,0.76,n)*
                       smoothstep(0.035,0.15,d.y)*
                       (1.0-smoothstep(0.72,0.98,d.y));
          vec3 cc=mix(vec3(0.11,0.14,0.22),vec3(0.76,0.79,0.82),day);
          cc=mix(cc,vec3(1.0,0.50,0.27),warm*0.85);
          sky=mix(sky,cc,clouds*(0.25+day*0.17));

          float haze=1.0-smoothstep(0.0,0.11,abs(d.y));
          vec3 hc=mix(vec3(0.10,0.15,0.25),vec3(0.55,0.68,0.76),day);
          hc=mix(hc,vec3(0.82,0.40,0.24),tw*0.62);
          sky=mix(sky,hc,haze*0.22);

          gl_FragColor=vec4(sky,1.0);
        }
      `
    });


    // Shared horizon color: both ocean surfaces meet at the same shade.
    const oceanHorizonGLSL = `
      vec3 oceanHorizon(vec3 V, float p, vec3 deep){
        float a=(p-0.25)*6.28318530718;
        vec3 sun=normalize(vec3(-cos(a)*0.72,sin(a),-0.69));
        float day=smoothstep(-0.12,0.16,sun.y);
        float tw=1.0-smoothstep(0.0,0.30,abs(sun.y));
        vec3 horizon=mix(vec3(0.025,0.055,0.11),vec3(0.55,0.72,0.82),day);
        horizon=mix(horizon,vec3(0.95,0.36,0.12),tw*0.8);
        vec3 sky=mix(vec3(0.012,0.025,0.07),vec3(0.22,0.48,0.75),day);
        vec3 reflection=mix(horizon,sky,clamp(V.y*0.5+0.5,0.0,1.0));
        vec3 base=deep*mix(vec3(0.10,0.16,0.28),vec3(1.0),day);
        float fresnel=pow(1.0-max(V.y,0.0),3.0);
        return mix(base,reflection,fresnel*0.68);
      }
    `;
    AFRAME.registerShader('libertalia-far-ocean',{
      schema:{
        phase:{type:'number',is:'uniform',default:0.75},
        deepColor:{type:'color',is:'uniform',default:'#0d5065'}
      },
      vertexShader:`varying vec3 vWorldPosition;
        void main(){vWorldPosition=(modelMatrix*vec4(position,1.0)).xyz;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
      fragmentShader:`precision mediump float;
        uniform float phase; uniform vec3 deepColor; varying vec3 vWorldPosition;
        ${oceanHorizonGLSL}
        void main(){vec3 V=normalize(cameraPosition-vWorldPosition);
          gl_FragColor=vec4(oceanHorizon(V,phase,deepColor),1.0);}`
    });

    AFRAME.registerShader('libertalia-water', {
      schema: {
        waveSeconds: {type: 'number', is: 'uniform', default: 0},
        deepColor:  {type: 'color', is: 'uniform', default: '#0d5065'},
        waterColor: {type: 'color', is: 'uniform', default: '#176f80'},
        foamColor:  {type: 'color', is: 'uniform', default: '#bce7df'},
        phase: {type: 'number', is: 'uniform', default: 0.75}
      },

      vertexShader: `
  uniform float waveSeconds;

  varying vec3 vWorldPosition;
  varying vec3 vNormal;
  varying float vWave;

  void main() {

    vec3 pos = position;
    float t = waveSeconds;

    /*
       ==================================================
       LIBERTALIA - MAR 0.2
       Oleaje orgánico multicapa
       ==================================================
    */

    // Oleaje principal.
    float wave1 =
      sin(pos.x * 0.22 + t * 1.10) * 0.08;

    float wave2 =
      sin(pos.y * 0.31 - t * 0.85) * 0.05;

    float wave3 =
      sin((pos.x + pos.y) * 0.16 + t * 0.55) * 0.035;


    /*
       Ondas secundarias diagonales.

       Son pequeñas deliberadamente:
       no queremos más altura, sino romper
       la regularidad del patrón anterior.
    */

    float phase4 =
      pos.x * 0.37 -
      pos.y * 0.23 +
      t * 0.73;

    float wave4 =
      sin(phase4) * 0.0175;


    float phase5 =
      pos.x * 0.13 +
      pos.y * 0.41 -
      t * 0.47;

    float wave5 =
      sin(phase5) * 0.0125;

    /* 0.8 - RELIEVE FINO REAL
       Dos ondulaciones cortas calculadas en el vertex shader.
       Aportan relieve y, sobre todo, normales mucho más ricas.
    */
    float phase6 =
      pos.x * 0.82 +
      pos.y * 0.34 +
      t * 1.28;

    float wave6 = sin(phase6) * 0.045;

    float phase7 =
      pos.x * 0.38 -
      pos.y * 0.96 -
      t * 1.05;

    float wave7 = sin(phase7) * 0.035;


    /*
       Modulación lenta.

       Hace que el oleaje secundario gane
       y pierda ligeramente intensidad
       según la zona y el momento.
    */

    float modulation =
      0.75 +
      0.25 *
      sin(
        pos.x * 0.045 +
        pos.y * 0.035 +
        t * 0.18
      );


    float wave =
        wave1
      + wave2
      + wave3
      + (wave4 + wave5) * modulation
      + wave6
      + wave7;


    pos.z += wave;


    vec4 world =
      modelMatrix * vec4(pos, 1.0);

    vWorldPosition = world.xyz;
    vWave = wave;


    /*
       ==================================================
       NORMAL APROXIMADA
       ==================================================

       Incluimos las nuevas ondas para que
       también afecten al Fresnel y al brillo.
    */

    float dx =
        0.22 * 0.08 *
        cos(pos.x * 0.22 + t * 1.10)

      + 0.16 * 0.035 *
        cos((pos.x + pos.y) * 0.16 + t * 0.55)

      + 0.37 * 0.0175 *
        cos(phase4) * modulation

      + 0.13 * 0.0125 *
        cos(phase5) * modulation

      + 0.82 * 0.045 *
        cos(phase6)

      + 0.38 * 0.035 *
        cos(phase7);


    float dy =
        0.31 * 0.05 *
        cos(pos.y * 0.31 - t * 0.85)

      + 0.16 * 0.035 *
        cos((pos.x + pos.y) * 0.16 + t * 0.55)

      - 0.23 * 0.0175 *
        cos(phase4) * modulation

      + 0.41 * 0.0125 *
        cos(phase5) * modulation

      + 0.34 * 0.045 *
        cos(phase6)

      - 0.96 * 0.035 *
        cos(phase7);


    vec3 localNormal =
      normalize(
        vec3(-dx, -dy, 1.0)
      );


    vNormal =
      normalize(
        mat3(modelMatrix) *
        localNormal
      );


    gl_Position =
      projectionMatrix *
      modelViewMatrix *
      vec4(pos, 1.0);
  }
` ,

      fragmentShader: `
  precision mediump float;

  uniform float phase;
  ${oceanHorizonGLSL}
  uniform vec3 deepColor;
  uniform vec3 waterColor;
  uniform vec3 foamColor;

  varying vec3 vWorldPosition;
  varying vec3 vNormal;
  varying float vWave;

  float coastRadius(float a) {
    float d=atan(sin(a-2.37748),cos(a-2.37748));
    return 3.0*(36.0 + sin(a*3.0+0.45)*2.0 + sin(a*5.0-1.10)
      - 17.0*exp(-d*d/0.40));
  }

  void main() {
    vec3 N = normalize(vNormal);
    vec3 V = normalize(cameraPosition - vWorldPosition);

    vec2 islandCenter = vec2(0.0, -5.0);
    vec2 rel = vWorldPosition.xz - islandCenter;
    float rawDistance = length(rel);
    float angle = atan(rel.y, rel.x);
    float coast = coastRadius(angle);
    float coastDistance = rawDistance - coast;

    /* Gradación costera: agua muy clara sobre arena -> turquesa -> océano. */
    float shelfFactor = smoothstep(0.15, 7.2, coastDistance);
    float lagoonFactor = smoothstep(0.15, 3.2, coastDistance);

    vec3 sandWater = vec3(0.18, 0.61, 0.63);
    vec3 turquoise = vec3(0.075, 0.47, 0.54);

    float waveTint = clamp(vWave * 1.8 + 0.5, 0.0, 1.0);
    vec3 normalWater = mix(deepColor, waterColor, waveTint);
    vec3 coastalWater = mix(sandWater, turquoise, lagoonFactor);
    vec3 baseWater = mix(coastalWater, normalWater, shelfFactor);

    float fresnel = pow(1.0 - max(dot(N, V), 0.0), 3.0);
    float skyAmount = clamp(V.y * 0.5 + 0.5, 0.0, 1.0);
    float a = (phase - 0.25) * 6.28318530718;
    vec3 sunDirection = normalize(vec3(-cos(a)*0.72, sin(a), -0.69));
    float daylight = smoothstep(-0.12, 0.16, sunDirection.y);
    float twilight = 1.0-smoothstep(0.0, 0.30, abs(sunDirection.y));
    vec3 horizon = mix(vec3(0.025,0.055,0.11),vec3(0.55,0.72,0.82),daylight);
    horizon = mix(horizon,vec3(0.95,0.36,0.12),twilight*0.8);
    vec3 sky = mix(vec3(0.012,0.025,0.07),vec3(0.22,0.48,0.75),daylight);
    baseWater *= mix(vec3(0.10,0.16,0.28), vec3(1.0), daylight);
    vec3 reflectedSky = mix(horizon, sky, skyAmount);
    vec3 color = mix(baseWater, reflectedSky, fresnel * 0.68);

    vec3 lightDir = sunDirection.y > 0.0 ? sunDirection : -sunDirection;
    vec3 H = normalize(lightDir + V);
    float specular = pow(max(dot(N, H), 0.0), 80.0);
    vec3 reflectedLight = mix(vec3(0.35,0.48,0.85)*0.36,
      mix(vec3(1.0,0.36,0.09),vec3(1.0,0.96,0.78),smoothstep(0.0,0.55,sunDirection.y)),daylight);
    color += reflectedLight * specular * 1.5;

    float crest = smoothstep(0.18, 0.32, vWave);
    color += foamColor * crest * 0.07;

    float shallowGlow = 1.0 - shelfFactor;
    color += vec3(0.025, 0.07, 0.055) * shallowGlow;

    /* 0.7f - PRUEBA DE BRILLO VISIBLE
       Misma tecnica compatible de 0.7e, deliberadamente mas intensa.
       Reutiliza vWave: sin nuevas funciones, varyings ni geometria.
    */
    /* MAR - TONALIDAD FINAL DE PRUEBA
       Conserva el relieve 0.8 pero comprime mucho el rango luminoso. */
    float surfaceDetail = clamp(vWave * 4.6 + 0.46, 0.0, 1.0);
    color += vec3(0.12, 0.32, 0.39) * surfaceDetail * 0.035;

    float surfaceShade = clamp(vWave * 5.0, -0.40, 0.40);
    color *= 1.0 + surfaceShade * 0.075;

    /* Brillo azulado contenido: las crestas ya no se van a blanco. */
    float broadSpec = pow(max(dot(N, H), 0.0), 26.0);
    color += vec3(0.20, 0.43, 0.50) * broadSpec * 0.030;

    /* Suelo azul marino: los valles nunca caen visualmente a negro. */
    color = max(color, mix(vec3(0.006,0.018,0.042),vec3(0.050,0.225,0.285),daylight));

    /*
       LIBERTALIA 0.7 - ESPUMA ORGÁNICA
       La línea sigue la misma costa irregular que la geometría.
       Dos escalas de ruido trigonométrico rompen la banda continua.
       La ola desplaza ligeramente el borde para simular avance/retroceso.
    */
    float alongCoast =
        sin(angle * 11.0 + vWorldPosition.x * 0.55) * 0.50
      + sin(angle * 19.0 - vWorldPosition.z * 0.43) * 0.28
      + sin(vWorldPosition.x * 1.35 + vWorldPosition.z * 0.92) * 0.22;

    /*
       LIBERTALIA 0.7d - ESPUMA EXPANDIDA + AGUA SOMERA MÁS TRANSPARENTE
       La espuma penetra bastante más sobre la playa y se ensancha un poco
       hacia el mar. El borde interior permanece anclado a la arena.
    */
    float movingOuter = coastDistance - vWave * 0.55;

    // Costa ampliada: espuma hasta 8–10 m hacia tierra para cubrir la playa somera.
    float anchoredInner = smoothstep(-10.0, -8.0, coastDistance);
    float anchoredOuter = 1.0 - smoothstep(0.58, 1.12, movingOuter);
    float anchoredBand = anchoredInner * anchoredOuter;

    // Irregularidad solo hacia el lado del mar; nunca rompe el contacto con arena.
    float breakup = smoothstep(-0.42, 0.34, alongCoast + vWave * 1.65);
    float seaSide = smoothstep(-0.08, 0.38, coastDistance);
    float irregularity = mix(1.0, mix(0.48, 1.0, breakup), seaSide);
    float lace = 0.72 + 0.28 * smoothstep(-0.10, 0.20, vWave);
    float shoreFoam = anchoredBand * irregularity * lace;

    // Lavado suave hasta 10–13 m hacia tierra, oculto por la arena emergida.
    float sandWashInner = smoothstep(-13.0, -10.0, coastDistance);
    float sandWashOuter = 1.0 - smoothstep(-0.12, 0.16, coastDistance);
    float sandWash = sandWashInner * sandWashOuter * (0.72 + 0.28 * breakup);

    // Restos de espuma mar adentro, separados y tenues.
    float washInner = smoothstep(0.55, 0.76, movingOuter);
    float washOuter = 1.0 - smoothstep(0.98, 1.38, movingOuter);
    float wash = washInner * washOuter * smoothstep(-0.15, 0.45, -alongCoast);

    vec3 shoreFoamColor = mix(vec3(0.10,0.16,0.25),vec3(0.93,0.995,0.975),daylight);
    float totalFoam = clamp(shoreFoam * 0.92 + sandWash * 0.30 + wash * 0.18, 0.0, 0.95);
    color = mix(color, shoreFoamColor, totalFoam);

    // Más transparente sobre la plataforma somera; recupera cuerpo mar adentro.
    float edgeDistance=max(abs(vWorldPosition.x),abs(vWorldPosition.z+5.0));
    float horizonBlend=smoothstep(155.0,198.0,edgeDistance);
    color=mix(color,oceanHorizon(V,phase,deepColor),horizonBlend);
    float waterAlpha = mix(mix(0.78, 0.93, shelfFactor),1.0,horizonBlend);
    gl_FragColor = vec4(color, waterAlpha);
  }
`
    });


    /* =========================================================
       LOCOMOCIÓN QUEST
       ========================================================= */

    // One coastline definition, mirrored in the ocean shader below.
    const BAY_ANGLE = Math.atan2(0.69, -0.72); // Moonrise at phase 0.75.
    function coastRadiusJS(a) {
      const d = Math.atan2(Math.sin(a-BAY_ANGLE),Math.cos(a-BAY_ANGLE));
      return 36 + 2*Math.sin(a*3+0.45) + Math.sin(a*5-1.1)
        - 17*Math.exp(-d*d/0.40);
    }
    // Coordinates: u right of the bay view, v toward the sea.
    const F={x:Math.cos(BAY_ANGLE),z:Math.sin(BAY_ANGLE)};
    const R={x:-F.z,z:F.x};
    function worldUV(u,v){return {x:R.x*u+F.x*v,z:-5+R.z*u+F.z*v};}
    function localUV(x,z){return {u:x*R.x+(z+5)*R.z,v:x*F.x+(z+5)*F.z};}
    const LANDMARKS=[
      {name:'PLAZA',u:0,v:0,h:4,r:12},
      {name:'TABERNA - PARCELA',u:3,v:-23,h:4,r:10},
      {name:'CASA DE ZIRA - PARCELA',u:-28,v:-8,h:6,r:9},
      {name:'PLAYA / EMBARCADERO',u:0,v:44,h:0.2,r:5},
      {name:'MIRADOR',u:43,v:14,h:13,r:5},
      {name:'PLAYA DE EXPLORACION',u:65,v:35,h:0.3,r:5},
      {name:'POZA / FUTURA CASCADA',u:-27,v:-43,h:10,r:7},
      {name:'RUINAS',u:8,v:-63,h:23,r:7}
    ];
    const ROUTES=[
      [[0,0,4],[0,18,3.6],[0,34,1.1],[0,44,0.2]],
      [[0,0,4],[3,-23,4]],
      [[0,0,4],[-15,-4,5],[-28,-8,6]],
      [[-28,-8,6],[-43,-19,7],[-43,-34,9],[-27,-43,10]],
      [[0,0,4],[19,0,5],[29,-10,8],[43,-4,11],[43,14,13]],
      [[43,14,13],[58,7,10],[72,15,6],[76,29,2],[65,35,0.3]],
      [[-27,-43,10],[-31,-52,10],[-40,-70,16],[0,-72,23],[8,-63,23]]
    ];
    function nearestRoute(u,v){
      let best={d:Infinity,h:0};
      for(const route of ROUTES)for(let i=1;i<route.length;i++){
        const a=route[i-1],b=route[i],du=b[0]-a[0],dv=b[1]-a[1];
        const t=Math.max(0,Math.min(1,((u-a[0])*du+(v-a[1])*dv)/(du*du+dv*dv)));
        const d=Math.hypot(u-a[0]-du*t,v-a[1]-dv*t);
        if(d<best.d)best={d,h:a[2]+(b[2]-a[2])*t};
      }
      return best;
    }
    function allowedTerrain(x,z){
      const {u,v}=localUV(x,z);
      if(LANDMARKS.some(p=>Math.hypot(u-p.u,v-p.v)<p.r-0.4))return true;
      return nearestRoute(u,v).d<1.65;
    }
    function terrainHeight(x,z){
      const r=Math.hypot(x,z+5),a=Math.atan2(z+5,x),inland=3*coastRadiusJS(a)-r;
      if(inland<0)return -0.72+inland*0.06;
      const t=Math.min(inland/45,1),e=t*t*(3-2*t);
      const {u,v}=localUV(x,z);
      let h=-0.72+4.5*e;
      // Rocky amphitheatre behind the settlement, fading out at the shore.
      h+=e*(38*Math.exp(-((u+35)**2/700+(v+68)**2/450))
        +43*Math.exp(-((u-35)**2/550+(v+65)**2/500))
        +20*Math.exp(-((u-56)**2/250+(v-2)**2/550)));
      h+=e*Math.max(0,Math.min(1,(-v-18)/25))*
        (Math.sin(u*.23+v*.12)*1.2+Math.sin(v*.32-u*.16)*.8);
      const path=nearestRoute(u,v);
      if(path.d<5.5){const t=Math.max(0,Math.min(1,(path.d-2.3)/3.2));const blend=t*t*(3-2*t);h=path.h*(1-blend)+h*blend;}
      for(const p of LANDMARKS){const d=Math.hypot(u-p.u,v-p.v);if(d<p.r+4){const t=Math.max(0,Math.min(1,(d-p.r)/4));const blend=t*t*(3-2*t);h=p.h*(1-blend)+h*blend;}}
      return h;
    }
    // Exact triangle interpolation on the rendered regular grid; no per-frame mesh raycast.
    const GRID_COUNT=240,GRID_SIZE=300,GRID_STEP=GRID_SIZE/GRID_COUNT;
    function terrainFloor(x,z){
      const gx=(x+150)/GRID_STEP,gz=(z+5+150)/GRID_STEP;
      if(gx<0||gz<0||gx>=GRID_COUNT||gz>=GRID_COUNT)return null;
      const i=Math.floor(gx),j=Math.floor(gz),tx=gx-i,tz=gz-j;
      const x0=-150+i*GRID_STEP,z0=-155+j*GRID_STEP;
      const a=terrainHeight(x0,z0),b=terrainHeight(x0,z0+GRID_STEP),c=terrainHeight(x0+GRID_STEP,z0);
      if(tx+tz<=1)return a+(c-a)*tx+(b-a)*tz;
      const d=terrainHeight(x0+GRID_STEP,z0+GRID_STEP);
      return d+(b-d)*(1-tx)+(c-d)*(1-tz);
    }

    AFRAME.registerComponent('island-nature', {
      init:function(){
        const T=AFRAME.THREE;
        this.root=new T.Group();this.el.setObject3D('mesh',this.root);
        this.clock=0;this.lights=[];this.lamps=[];
        let seed=1715;
        const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};
        const dummy=new T.Object3D();
        const instances=(geometry,material,items)=>{
          if(!items.length)return;
          const mesh=new T.InstancedMesh(geometry,material,items.length);
          items.forEach((p,i)=>{dummy.position.set(p.x,p.y,p.z);dummy.rotation.set(p.rx||0,p.ry||0,p.rz||0);dummy.scale.set(p.sx||1,p.sy||1,p.sz||1);dummy.updateMatrix();mesh.setMatrixAt(i,dummy.matrix);if(p.color)mesh.setColorAt(i,new T.Color(p.color));});
          mesh.instanceMatrix.needsUpdate=true;if(mesh.instanceColor)mesh.instanceColor.needsUpdate=true;
          mesh.computeBoundingSphere();this.root.add(mesh);return mesh;
        };
        const bark=new T.MeshStandardMaterial({color:'#705039',roughness:1});
        const foliage=new T.MeshStandardMaterial({color:'#4b793b',roughness:1,side:T.DoubleSide});
        const stone=new T.MeshStandardMaterial({color:'#77756a',roughness:1,flatShading:true});
        const trunks=[],leaves=[],canopies=[],shrubs=[],rocks=[];
        // Curved tapered palm frond, shared by every leaf instance.
        const verts=[],idx=[];
        for(let i=0;i<=9;i++){
          const t=i/9,x=t*4.3,y=Math.sin(t*Math.PI)*.75-t*t*1.1,w=Math.sin(t*Math.PI)*.48+.015;
          verts.push(x,y,-w,x,y+.09,w);
          if(i<9){const n=i*2;idx.push(n,n+2,n+1,n+1,n+2,n+3);}
        }
        const leafGeometry=new T.BufferGeometry();leafGeometry.setAttribute('position',new T.Float32BufferAttribute(verts,3));leafGeometry.setIndex(idx);leafGeometry.computeVertexNormals();
        // Keep paths and reserved plots clear. Density increases inland.
        for(let n=0;n<1800;n++){
          const u=(rand()-.5)*195,v=(rand()-.5)*195,w=worldUV(u,v);
          const inland=3*coastRadiusJS(Math.atan2(w.z+5,w.x))-Math.hypot(w.x,w.z+5);
          if(inland<8||nearestRoute(u,v).d<5||LANDMARKS.some(p=>Math.hypot(u-p.u,v-p.v)<p.r+4))continue;
          // Clear the sightline from the lookout toward the settlement and bay.
          if(u>0&&u<44&&v>-4&&v<27)continue;
          if(u>-29&&u<-15&&v>-57&&v<-38)continue;
          const y=terrainFloor(w.x,w.z);if(y===null||y<.2)continue;
          const palm=v>4||rand()<.40,h=5+rand()*5;
          trunks.push({x:w.x,y:y+h*.5,z:w.z,sx:palm?.8:1.15,sy:h,sz:palm?.8:1.15,ry:rand()*6.28});
          if(palm){
            for(let j=0;j<7;j++)leaves.push({x:w.x,y:y+h,z:w.z,ry:j*Math.PI*2/7+rand()*.3,sx:.8+rand()*.4,sy:1,sz:1,color:['#386335','#477b3b','#5b8840'][j%3]});
          }else{
            canopies.push({x:w.x,y:y+h-.5,z:w.z,sx:2.8+rand()*1.8,sy:2.1+rand()*1.3,sz:2.8+rand()*1.8,ry:rand()*6,color:rand()<.5?'#2e5636':'#42683a'});
            canopies.push({x:w.x+1.4,y:y+h-1.8,z:w.z-.9,sx:2.4,sy:2,sz:2.6});
          }
          if(rand()<.65)shrubs.push({x:w.x+1,y:y+.65,z:w.z+1.4,sx:1.4,sy:.9,sz:1.7,color:'#496b38'});
        }
        for(let n=0;n<420;n++){
          const u=(rand()-.5)*195,v=(rand()-.5)*195,w=worldUV(u,v),y=terrainFloor(w.x,w.z);
          if(y===null||y<-.8||nearestRoute(u,v).d<5||LANDMARKS.some(p=>Math.hypot(u-p.u,v-p.v)<p.r+4))continue;
          if(u>-29&&u<-15&&v>-57&&v<-38)continue;
          const r=1+rand()*3.5;
          rocks.push({x:w.x,y:y+r*.20,z:w.z,sx:r,sy:r*(.6+rand()),sz:r,ry:rand()*6.28,rx:rand()*.4,color:rand()<.5?'#65665b':'#8b8472'});
        }
        instances(new T.CylinderGeometry(.15,.23,1,7),bark,trunks);
        instances(leafGeometry,foliage,leaves);
        instances(new T.IcosahedronGeometry(1,1),foliage,canopies);
        instances(new T.IcosahedronGeometry(1,0),foliage,shrubs);
        instances(new T.DodecahedronGeometry(1,0),stone,rocks);
        // Waterfall behind the accessible pool, beside the ruins route.
        const poolUV={u:-21,v:-44},pool=worldUV(poolUV.u,poolUV.v);
        const poolY=terrainFloor(pool.x,pool.z)+.12;
        this.pool={x:pool.x,z:pool.z,r:2.5};
        const back=worldUV(-21,-50),top=Math.max(poolY+11,terrainFloor(back.x,back.z)+2);
        for(let i=0;i<10;i++){
          const at=worldUV(-21+(i<5?-3.2:3.2),-46-(i%5)*1.5),h=terrainFloor(at.x,at.z);
          const rock=new T.Mesh(new T.DodecahedronGeometry(1,0),stone);
          rock.position.set(at.x,h+1.8,at.z);rock.scale.set(2,3.3,1.7);this.root.add(rock);
        }
        const waterfallMaterial=new T.ShaderMaterial({
          uniforms:{seconds:{value:0},day:{value:1}},side:T.DoubleSide,transparent:true,
          vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
          fragmentShader:`precision mediump float;varying vec2 vUv;uniform float seconds;uniform float day;
            void main(){float stripes=sin(vUv.x*95.+sin(vUv.y*18.+seconds*7.)*2.);
              float streak=sin(vUv.y*70.+seconds*19.+vUv.x*11.);
              float edge=smoothstep(0.,.12,vUv.x)*(1.-smoothstep(.88,1.,vUv.x));
              vec3 c=mix(vec3(.17,.49,.58),vec3(.85,.96,.95),.55+.25*stripes+.16*streak);
              gl_FragColor=vec4(c*(.3+.7*day),edge*.88);}`
        });
        this.waterMaterial=waterfallMaterial;
        const fallGeometry=new T.BufferGeometry();
        fallGeometry.setAttribute('position',new T.Float32BufferAttribute([
          back.x-R.x*2.2,top,back.z-R.z*2.2,back.x+R.x*2.2,top,back.z+R.z*2.2,
          pool.x-R.x*2.2,poolY,pool.z-R.z*2.2,pool.x+R.x*2.2,poolY,pool.z+R.z*2.2],3));
        fallGeometry.setAttribute('uv',new T.Float32BufferAttribute([0,1,1,1,0,0,1,0],2));
        fallGeometry.setIndex([0,2,1,1,2,3]);fallGeometry.computeVertexNormals();
        const fall=new T.Mesh(fallGeometry,waterfallMaterial);this.root.add(fall);
        const poolMat=new T.MeshStandardMaterial({color:'#398b89',roughness:.25,metalness:.15,transparent:true,opacity:.9,side:T.DoubleSide});
        const basin=new T.Mesh(new T.CircleGeometry(2.8,32),poolMat);basin.rotation.x=-Math.PI/2;basin.position.set(pool.x,poolY,pool.z);this.root.add(basin);
        const white=new T.MeshBasicMaterial({color:'#d6eee5',transparent:true,opacity:.52,side:T.DoubleSide});
        const foam=new T.Mesh(new T.RingGeometry(1.9,2.75,32),white);foam.rotation.x=-Math.PI/2;foam.position.set(pool.x,poolY+.02,pool.z);this.root.add(foam);this.foam=foam;
        const mist=new T.Mesh(new T.SphereGeometry(1,8,6),new T.MeshBasicMaterial({color:'#e0f0e7',transparent:true,opacity:.17,depthWrite:false}));
        mist.position.set(pool.x,poolY+.65,pool.z);mist.scale.set(2,.8,1.3);this.root.add(mist);this.mist=mist;
        // Torches along both sides of paths, only three nearby point lights active.
        const posts=[],flames=[],seen=new Set();
        for(const route of ROUTES)for(let j=1;j<route.length;j++){
          const a=route[j-1],b=route[j],len=Math.hypot(b[0]-a[0],b[1]-a[1]);
          for(let d=0;d<len;d+=9){
            const t=d/len,u=a[0]+(b[0]-a[0])*t-(b[1]-a[1])/len*2.05,v=a[1]+(b[1]-a[1])*t+(b[0]-a[0])/len*2.05;
            const key=Math.round(u/4)+','+Math.round(v/4);if(seen.has(key))continue;seen.add(key);
            const at=worldUV(u,v),h=terrainFloor(at.x,at.z);if(h===null)continue;
            posts.push({x:at.x,y:h+.8,z:at.z,sx:.55,sy:1.6,sz:.55});
            flames.push({x:at.x,y:h+1.85,z:at.z,sx:.19,sy:.5,sz:.19});
            this.lamps.push(new T.Vector3(at.x,h+1.95,at.z));
          }
        }
        instances(new T.CylinderGeometry(.15,.18,1,6),bark,posts);
        this.flameMesh=instances(new T.SphereGeometry(1,7,5),new T.MeshBasicMaterial({color:'#ffc16a'}),flames);
        for(let i=0;i<3;i++){const light=new T.PointLight('#ffba70',0,14,2);this.root.add(light);this.lights.push(light);}
        this.stats={trees:trunks.length,rocks:rocks.length,torches:posts.length};
      },
      tick:function(time,delta){
        this.clock+=Math.min(delta||0,100)/1000;
        const ocean=document.querySelector('#ocean').components.material;
        const phase=ocean?.material?.uniforms?.phase?.value||0;
        const sy=Math.sin((phase-.25)*Math.PI*2),night=1-Math.max(0,Math.min(1,(sy+.12)/.32));
        this.waterMaterial.uniforms.seconds.value=this.clock;this.waterMaterial.uniforms.day.value=1-night;
        this.foam.material.opacity=.42+Math.sin(this.clock*2)*.08;
        this.mist.material.opacity=.14+Math.sin(this.clock*1.3)*.04;
        const rig=document.querySelector('#rig').object3D.position;
        if(!this.lastLightUpdate||time-this.lastLightUpdate>250){
          const ordered=this.lamps.map(p=>({p,d:p.distanceToSquared(rig)})).sort((a,b)=>a.d-b.d);
          this.lights.forEach((light,i)=>{if(ordered[i])light.position.copy(ordered[i].p);});this.lastLightUpdate=time;
        }
        this.lights.forEach((l,i)=>{l.intensity=night*(5.5+Math.sin(this.clock*6+i)*.35);});
      },
      remove:function(){
        this.root.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose();});
        this.el.removeObject3D('mesh');
      }
    });

    AFRAME.registerComponent('terrain-walk', {
      init:function(){
        this.ray=new AFRAME.THREE.Raycaster();
        this.origin=new AFRAME.THREE.Vector3();
        this.down=new AFRAME.THREE.Vector3(0,-1,0);
        this.keys={};
        this.keydown=e=>{if(!/INPUT|TEXTAREA/.test(e.target.tagName))this.keys[e.code]=true;};
        this.keyup=e=>{this.keys[e.code]=false;};
        this.blur=()=>{this.keys={};};
        window.addEventListener('keydown',this.keydown);
        window.addEventListener('keyup',this.keyup);
        window.addEventListener('blur',this.blur);
      },
      floor:function(x,z){return terrainFloor(x,z);},
      blocked:function(x,z){
        const pool=document.querySelector('#island-nature')?.components['island-nature']?.pool;
        if(pool&&Math.hypot(x-pool.x,z-pool.z)<pool.r+.28)return true;
        for(const el of document.querySelectorAll('[data-solid]')){
          const b=new AFRAME.THREE.Box3().setFromObject(el.object3D);
          if(x>b.min.x-0.28&&x<b.max.x+0.28&&z>b.min.z-0.28&&z<b.max.z+0.28)return true;
        }
        return false;
      },
      move:function(dx,dz){
        const p=this.el.object3D.position;
        const n=Math.max(1,Math.ceil(Math.hypot(dx,dz)/0.12));
        for(let i=0;i<n;i++){
          const x=p.x+dx/n,z=p.z+dz/n,h=this.floor(x,z);
          if(h===null||h< -0.35||!allowedTerrain(x,z)||this.blocked(x,z))break;
          const current=this.floor(p.x,p.z);
          if(current!==null&&Math.abs(h-current)>Math.hypot(dx/n,dz/n)*0.72+0.015)break;
          p.set(x,h,z);
        }
      },
      tick:function(time,delta){
        const p=this.el.object3D.position,h=this.floor(p.x,p.z);
        if(h!==null)p.y=h;
        const camera=document.querySelector('#camera');
        const direction=new AFRAME.THREE.Vector3();camera.getObject3D('camera').getWorldDirection(direction);
        direction.y=0;direction.normalize();
        const right=new AFRAME.THREE.Vector3().crossVectors(direction,new AFRAME.THREE.Vector3(0,1,0));
        const forward=(this.keys.KeyW||this.keys.ArrowUp?1:0)-(this.keys.KeyS||this.keys.ArrowDown?1:0);
        const side=(this.keys.KeyD||this.keys.ArrowRight?1:0)-(this.keys.KeyA||this.keys.ArrowLeft?1:0);
        const scale=3*Math.min(delta||0,50)/1000/Math.max(1,Math.hypot(forward,side));
        if(forward||side)this.move((direction.x*forward+right.x*side)*scale,(direction.z*forward+right.z*side)*scale);
      },
      remove:function(){window.removeEventListener('keydown',this.keydown);window.removeEventListener('keyup',this.keyup);window.removeEventListener('blur',this.blur);}
    });
    AFRAME.registerComponent('quest-locomotion', {
      init:function(){this.axis=[0,0];this.el.addEventListener('thumbstickmoved',e=>{this.axis=[e.detail.x,e.detail.y];});},
      tick:function(time,delta){
        const rig=document.querySelector('#rig'),camera=document.querySelector('#camera');
        const walk=rig.components['terrain-walk'];if(!walk)return;
        let x=this.axis[0]||0,y=this.axis[1]||0;
        if(Math.hypot(x,y)<0.15)return;
        const d=new AFRAME.THREE.Vector3();camera.getObject3D('camera').getWorldDirection(d);d.y=0;d.normalize();
        const right=new AFRAME.THREE.Vector3().crossVectors(d,new AFRAME.THREE.Vector3(0,1,0));
        const speed=3*Math.min(delta||0,50)/1000/Math.max(1,Math.hypot(x,y));
        walk.move((d.x*-y+right.x*x)*speed,(d.z*-y+right.z*x)*speed);
      }
    });

    /* =========================================================
       GIRO SUAVE
       ========================================================= */

    AFRAME.registerComponent('smooth-turn', {

      init: function () {

        this.turnX = 0;

        this.el.addEventListener(
          'thumbstickmoved',
          (event) => {

            this.turnX =
              event.detail.x || 0;
          }
        );
      },

      tick: function (time, delta) {

        if (
          Math.abs(this.turnX) < 0.15
        ) return;

        const rig =
          document.querySelector('#rig');

        if (!rig) return;

        const turnSpeed = 180;

        const amount =
          -this.turnX *
          turnSpeed *
          (delta / 1000);

        rig.object3D.rotation.y +=
          THREE.MathUtils.degToRad(amount);
      }
    });

  </script>
</head>

  <script>
    AFRAME.registerComponent('smooth-island', {
      init:function(){
        const T=AFRAME.THREE, positions=[],colors=[],indices=[], count=GRID_COUNT,size=GRID_SIZE;
        for(let j=0;j<=count;j++)for(let i=0;i<=count;i++){
          const x=-size/2+i*size/count,z=-size/2+j*size/count,h=terrainHeight(x,z-5);
          positions.push(x,h,z);
          const inland=coastRadiusJS(Math.atan2(z,x))-Math.hypot(x,z)/3;
          const uv=localUV(x,z-5),path=nearestRoute(uv.u,uv.v);
          const plot=LANDMARKS.some(p=>Math.hypot(uv.u-p.u,uv.v-p.v)<p.r);
          const c=new T.Color(plot?'#bca576':path.d<2.3?'#c5b48c':h>15?'#686b5b':inland<7?'#dec391':'#567348');
          c.multiplyScalar(0.94+0.06*Math.sin(x*3.7+z*2.3));colors.push(c.r,c.g,c.b);
        }
        for(let j=0;j<count;j++)for(let i=0;i<count;i++){
          const a=j*(count+1)+i,b=a+count+1;indices.push(a,b,a+1,b,b+1,a+1);
        }
        const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(positions,3));
        g.setAttribute('color',new T.Float32BufferAttribute(colors,3));g.setIndex(indices);g.computeVertexNormals();
        this.el.setObject3D('mesh',new T.Mesh(g,new T.MeshStandardMaterial({vertexColors:true,roughness:1,side:T.DoubleSide})));
      }
    });

    document.querySelector('#smoothIsland').setAttribute('smooth-island', '');
    for(const p of LANDMARKS){
      const at=worldUV(p.u,p.v),el=document.createElement('a-entity');

      label.setAttribute('align','center');label.setAttribute('width','12');
      label.setAttribute('color','#fff2ca');el.appendChild(label);
      document.querySelector('a-scene').appendChild(el);
    }

</a-camera>

    <a-entity
      id="leftHand"
      hand-controls="hand: left"
      quest-locomotion>
    </a-entity>

    <a-entity
      id="rightHand"
      hand-controls="hand: right"
      smooth-turn>
    </a-entity>

  </a-entity>

</a-scene>


<script>
(function(){
  const CYCLE_SECONDS=40;
  let phase=0.75, auto=true, motionSeconds=0, starfield=null;
  const clamp=x=>Math.max(0,Math.min(1,x));
  function mixHex(a,b,t){
    const A=[1,3,5].map(i=>parseInt(a.slice(i,i+2),16));
    const B=[1,3,5].map(i=>parseInt(b.slice(i,i+2),16));
    return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('');
  }
  function sunY(p){return Math.sin((p-0.25)*Math.PI*2);}
  function name(p){
    if(p<0.18||p>=0.90)return'NOCHE';
    if(p<0.34)return'AMANECER';
    if(p<0.66)return'DIA';
    if(p<0.84)return'ATARDECER';
    return'CREPUSCULO';
  }
  function apply(){
    const sky=document.querySelector('#libertalia-sky'),
          amb=document.querySelector('#ambient-cycle'),
          sun=document.querySelector('#sun-cycle'),
          lab=document.querySelector('#time-label');
    if(!sky||!amb||!sun)return;
    // Update uniforms directly, preserving the shader clocks between frames.
    for(const id of ['#libertalia-sky','#ocean','#far-ocean']){
      const material=document.querySelector(id).components.material;
      const uniforms=material && material.material && material.material.uniforms;
      if(!uniforms) continue;
      if(uniforms.phase) uniforms.phase.value=phase;
      if(uniforms.waveSeconds) uniforms.waveSeconds.value=motionSeconds;
      if(uniforms.time) uniforms.time.value=motionSeconds*1000;
    }
    const sy=sunY(phase), ang=(phase-0.25)*Math.PI*2;
    const day=clamp((sy+0.12)/0.32);
    const tw=1-clamp(Math.abs(sy)/0.38);
    sun.setAttribute('position',`${-Math.cos(ang)*0.72*8} ${sy*8} ${-0.69*8}`);

    const sunDisc=document.querySelector('#sun-disc');
    const moonDisc=document.querySelector('#moon-disc');
    const direction=new THREE.Vector3(-Math.cos(ang)*0.72,sy,-0.69).normalize();
    const eye=document.querySelector('#camera').object3D.getWorldPosition(new THREE.Vector3());
    if(starfield){
      starfield.position.copy(eye);
      starfield.material.uniforms.night.value=clamp((0.08-direction.y)/0.28);
      starfield.material.uniforms.seconds.value=motionSeconds;
    }
    const cx=direction.x*900, cy=direction.y*900, cz=direction.z*900;
    if(sunDisc){
      sunDisc.setAttribute('position',`${eye.x+cx} ${eye.y+cy} ${eye.z+cz}`);
      sunDisc.object3D.lookAt(eye);
      sunDisc.setAttribute('visible',sy>-0.12);
      sunDisc.setAttribute('material','color',mixHex('#FF8F36','#FFF4CC',clamp(sy*2)));
    }
    if(moonDisc){
      moonDisc.setAttribute('position',`${eye.x-cx} ${eye.y-cy} ${eye.z-cz}`);
      moonDisc.object3D.lookAt(eye);
      moonDisc.setAttribute('visible',sy<0.10);
    }

    sun.setAttribute('intensity',(day*(0.62+0.58*Math.max(0,sy))).toFixed(3));
    sun.setAttribute('color',mixHex('#FFB06A','#FFF3D1',Math.max(0,sy)));
    amb.setAttribute('intensity',(0.16+day*0.48+tw*0.08).toFixed(3));
    amb.setAttribute('color',mixHex('#53647A','#C9D8E3',day));
    const minutes=Math.floor(phase*1440)%1440;
    const hour=String(Math.floor(minutes/60)).padStart(2,'0')+':'+String(minutes%60).padStart(2,'0');
    if(lab)lab.setAttribute('value',name(phase)+' '+hour+(auto?' [AUTO]':' [PAUSA]'));
  }
  function choose(v){
    phase=((v%1)+1)%1; auto=false;
    const t=document.querySelector('#autoText'); if(t)t.setAttribute('value','AUTO');
    apply();
  }
  function makeStars(){
    const count=850, positions=[], colors=[], sizes=[], offsets=[];
    let seed=1927;
    function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}
    for(let i=0;i<count;i++){
      const y=0.025+rand()*0.975, angle=rand()*Math.PI*2, r=Math.sqrt(1-y*y);
      positions.push(Math.cos(angle)*r*1250,y*1250,Math.sin(angle)*r*1250);
      const warm=rand(), brightness=0.55+rand()*0.45;
      colors.push(brightness*(warm>0.8?1:0.83),brightness*0.91,brightness*(warm>0.8?0.78:1));
      sizes.push(1.6+Math.pow(rand(),3)*3.2);offsets.push(rand()*Math.PI*2);
    }
    const geometry=new THREE.BufferGeometry();
    geometry.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
    geometry.setAttribute('starColor',new THREE.Float32BufferAttribute(colors,3));
    geometry.setAttribute('starSize',new THREE.Float32BufferAttribute(sizes,1));
    geometry.setAttribute('offset',new THREE.Float32BufferAttribute(offsets,1));
    const material=new THREE.ShaderMaterial({
      uniforms:{night:{value:0},seconds:{value:0}},
      transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
      vertexShader:`attribute vec3 starColor; attribute float starSize; attribute float offset;
        uniform float seconds; varying vec3 tint; varying float flicker;
        void main(){tint=starColor;flicker=0.90+0.10*sin(seconds*1.1+offset);
          gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
          gl_PointSize=starSize;}`,
      fragmentShader:`precision mediump float;uniform float night;
        varying vec3 tint;varying float flicker;
        void main(){float r=length(gl_PointCoord-vec2(0.5));
          float glow=1.0-smoothstep(0.05,0.5,r);
          gl_FragColor=vec4(tint*flicker,glow*night);}`
    });
    starfield=new THREE.Points(geometry,material);starfield.frustumCulled=false;
    document.querySelector('a-scene').object3D.add(starfield);
  }
  function makeAstroTextures(){
    function canvas(id){
      const c=document.createElement('canvas'); c.id=id; c.width=c.height=512;
      c.style.display='none'; document.body.appendChild(c); return c;
    }
    const sunCanvas=canvas('solar-texture'), sc=sunCanvas.getContext('2d');
    const glow=sc.createRadialGradient(256,256,105,256,256,252);
    glow.addColorStop(0,'rgba(255,235,170,0.65)');
    glow.addColorStop(0.25,'rgba(255,209,108,0.25)');
    glow.addColorStop(1,'rgba(255,190,70,0)');
    sc.fillStyle=glow; sc.fillRect(0,0,512,512);
    const disk=sc.createRadialGradient(235,225,0,256,256,115);
    disk.addColorStop(0,'#ffffff'); disk.addColorStop(0.75,'#fff9df'); disk.addColorStop(1,'#ffe6a2');
    sc.fillStyle=disk; sc.beginPath(); sc.arc(256,256,115,0,Math.PI*2); sc.fill();
    const moonCanvas=canvas('lunar-texture'), mc=moonCanvas.getContext('2d');
    const halo=mc.createRadialGradient(256,256,151,256,256,251);
    halo.addColorStop(0,'rgba(185,208,255,0.16)'); halo.addColorStop(1,'rgba(185,208,255,0)');
    mc.fillStyle=halo; mc.fillRect(0,0,512,512);
    mc.save(); mc.beginPath(); mc.arc(256,256,153,0,Math.PI*2); mc.clip();
    const surface=mc.createRadialGradient(222,219,5,256,256,165);
    surface.addColorStop(0,'#ecece5'); surface.addColorStop(0.8,'#ccd0d0'); surface.addColorStop(1,'#9ea8b5');
    mc.fillStyle=surface; mc.fillRect(0,0,512,512);
    // Broad irregular maria, then scattered small crater rims. Fixed seed.
    let seed=713; function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}
    for(let i=0;i<27;i++){
      const x=150+rand()*210,y=143+rand()*214,r=12+rand()*36;
      const g=mc.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0,'rgba(70,83,98,0.22)');g.addColorStop(1,'rgba(70,83,98,0)');
      mc.fillStyle=g;mc.fillRect(x-r,y-r,r*2,r*2);
    }
    for(let i=0;i<150;i++){
      const x=106+rand()*300,y=106+rand()*300,r=1+rand()*6;
      mc.beginPath();mc.arc(x,y,r,0,Math.PI*2);mc.fillStyle='rgba(74,84,94,0.13)';mc.fill();
      mc.beginPath();mc.arc(x-0.7,y-0.7,r,Math.PI*1.05,Math.PI*1.8);
      mc.strokeStyle='rgba(255,255,243,0.28)';mc.lineWidth=0.8;mc.stroke();
    }
    mc.restore();
    document.querySelector('#sun-disc').setAttribute('material','src','#solar-texture');
    document.querySelector('#moon-disc').setAttribute('material','src','#lunar-texture');
  }
  window.addEventListener('load',()=>{
    makeAstroTextures();
    makeStars();
    document.querySelectorAll('.timeBtn').forEach(e=>e.addEventListener('click',()=>choose(parseFloat(e.dataset.phase))));
    const ab=document.querySelector('#autoBtn');
    if(ab)ab.addEventListener('click',()=>{
      auto=!auto;
      const t=document.querySelector('#autoText'); if(t)t.setAttribute('value',auto?'PAUSA':'AUTO');
      apply();
    });
    apply();
    const scene=document.querySelector('a-scene');
    // Attach the clock to a child entity, like the working locomotion components.
    AFRAME.registerComponent('libertalia-clock', {
      init: function(){ this.previous=null; },
      tick: function(){
        const now=performance.now();
        const elapsed=this.previous===null?0:Math.max(0,Math.min((now-this.previous)/1000,0.25));
        this.previous=now;
        motionSeconds+=elapsed;
        if(auto) phase=(phase+elapsed/CYCLE_SECONDS)%1;
        apply();
      },
      play: function(){ this.previous=null; }
    });
    document.querySelector('#celestial-root').setAttribute('libertalia-clock','');
    scene.addEventListener('enter-vr',()=>{
      auto=true;
      document.querySelector('#autoText').setAttribute('value','PAUSA');
      apply();
    });
    // Explicit trigger press: looking at a button cannot pause the clock.
    document.querySelector('#rightHand').addEventListener('triggerdown',()=>{
      const ray=document.querySelector('#time-cursor').components.raycaster;
      if(!ray || !ray.intersectedEls.length) return;
      const target=ray.intersectedEls[0];
      if(target.classList.contains('clickable')) target.emit('click',{source:'trigger'});
    });
  });
})();
</script>

</body>
</html>
