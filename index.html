<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hispaniola II - Prueba WebXR</title>

  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
</head>

<body>

  <a-scene>
    
    <!-- Suelo -->
    <a-plane
      position="0 0 -4"
      rotation="-90 0 0"
      width="20"
      height="20"
      color="#CDBA87">
    </a-plane>

    <!-- Nuestro glorioso primer cubo 😂 -->
    <a-box
      position="0 1 -4"
      width="1"
      height="2"
      depth="1"
      color="#8B4513">
    </a-box>

    <!-- Una esfera para comprobar profundidad -->
    <a-sphere
      position="2 1 -5"
      radius="0.75"
      color="#D8B46A">
    </a-sphere>

    <!-- Una especie de mar provisional -->
    <a-plane
      position="0 -0.05 -14"
      rotation="-90 0 0"
      width="40"
      height="15"
      color="#287F9E">
    </a-plane>

    <!-- Cielo -->
    <a-sky color="#87CEEB"></a-sky>

    <!-- Cámara / jugador -->
    <a-entity
      position="0 0 0"
      camera
      look-controls
      wasd-controls>
    </a-entity>

  </a-scene>

</body>
</html>
