<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Libertalia - Laboratorio del Mar 0.1</title>

  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

  <script>
    /* =========================================================
       AGUA EXPERIMENTAL - LIBERTALIA
       ========================================================= */

    AFRAME.registerShader('libertalia-water', {
      schema: {
        time:       {type: 'time', is: 'uniform'},
        deepColor:  {type: 'color', is: 'uniform', default: '#063c52'},
        waterColor: {type: 'color', is: 'uniform', default: '#087d91'},
        foamColor:  {type: 'color', is: 'uniform', default: '#bce7df'}
      },

      vertexShader: `
  uniform float time;

  varying vec3 vWorldPosition;
  varying vec3 vNormal;
  varying float vWave;

  void main() {

    vec3 pos = position;
    float t = time * 0.001;

    /*
       ==================================================
       LIBERTALIA - MAR 0.2
       Oleaje orgánico multicapa
       ==================================================
    */

    // Oleaje principal.
    float wave1 =
      sin(pos.x * 0.22 + t * 1.10) * 0.16;

    float wave2 =
      sin(pos.y * 0.31 - t * 0.85) * 0.10;

    float wave3 =
      sin((pos.x + pos.y) * 0.16 + t * 0.55) * 0.07;


    /*
       Ondas secundarias diagonales.

       Son pequeñas deliberadamente:
       no queremos más altura, sino romper
       la regularidad del patrón anterior.
    */

    float phase4 =
      pos.x * 0.37 -
      pos.y * 0.23 +
      t * 0.73;

    float wave4 =
      sin(phase4) * 0.035;


    float phase5 =
      pos.x * 0.13 +
      pos.y * 0.41 -
      t * 0.47;

    float wave5 =
      sin(phase5) * 0.025;


    /*
       Modulación lenta.

       Hace que el oleaje secundario gane
       y pierda ligeramente intensidad
       según la zona y el momento.
    */

    float modulation =
      0.75 +
      0.25 *
      sin(
        pos.x * 0.045 +
        pos.y * 0.035 +
        t * 0.18
      );


    float wave =
        wave1
      + wave2
      + wave3
      + (wave4 + wave5) * modulation;


    pos.z += wave;


    vec4 world =
      modelMatrix * vec4(pos, 1.0);

    vWorldPosition = world.xyz;
    vWave = wave;


    /*
       ==================================================
       NORMAL APROXIMADA
       ==================================================

       Incluimos las nuevas ondas para que
       también afecten al Fresnel y al brillo.
    */

    float dx =
        0.22 * 0.16 *
        cos(pos.x * 0.22 + t * 1.10)

      + 0.16 * 0.07 *
        cos((pos.x + pos.y) * 0.16 + t * 0.55)

      + 0.37 * 0.035 *
        cos(phase4) * modulation

      + 0.13 * 0.025 *
        cos(phase5) * modulation;


    float dy =
        0.31 * 0.10 *
        cos(pos.y * 0.31 - t * 0.85)

      + 0.16 * 0.07 *
        cos((pos.x + pos.y) * 0.16 + t * 0.55)

      - 0.23 * 0.035 *
        cos(phase4) * modulation

      + 0.41 * 0.025 *
        cos(phase5) * modulation;


    vec3 localNormal =
      normalize(
        vec3(-dx, -dy, 1.0)
      );


    vNormal =
      normalize(
        mat3(modelMatrix) *
        localNormal
      );


    gl_Position =
      projectionMatrix *
      modelViewMatrix *
      vec4(pos, 1.0);
  }
` ,

      fragmentShader: `
  precision mediump float;

  uniform vec3 deepColor;
  uniform vec3 waterColor;
  uniform vec3 foamColor;

  varying vec3 vWorldPosition;
  varying vec3 vNormal;
  varying float vWave;

  void main() {

    vec3 N = normalize(vNormal);

    vec3 V =
      normalize(cameraPosition - vWorldPosition);


    /*
       ================================================
       LIBERTALIA - MAR 0.3
       PROFUNDIDAD COSTERA SIMULADA
       ================================================

       La isla está aproximadamente centrada
       alrededor de (0, -5).

       Calculamos la distancia horizontal de cada
       fragmento de agua respecto al centro.
    */

    vec2 islandCenter =
      vec2(0.0, -5.0);

    float distanceToIsland =
      distance(
        vWorldPosition.xz,
        islandCenter
      );


    /*
       La playa principal tiene unos 9 m de radio.

       Entre aproximadamente 7 y 15 metros hacemos
       la transición de agua somera a profunda.
    */

    float depthFactor =
      smoothstep(
        7.0,
        15.0,
        distanceToIsland
      );


    /*
       Color tropical para el agua poco profunda.
    */

    vec3 shallowColor =
      vec3(
        0.08,
        0.68,
        0.68
      );


    /*
       Variación producida por las olas.
    */

    float waveTint =
      clamp(
        vWave * 1.8 + 0.5,
        0.0,
        1.0
      );

    vec3 normalWater =
      mix(
        deepColor,
        waterColor,
        waveTint
      );


    /*
       Cerca de la isla domina shallowColor.
       Conforme nos alejamos recuperamos
       el océano original.
    */

    vec3 baseWater =
      mix(
        shallowColor,
        normalWater,
        depthFactor
      );


    /*
       ================================================
       FRESNEL
       ================================================
    */

    float fresnel =
      pow(
        1.0 -
        max(dot(N, V), 0.0),
        3.0
      );


    /*
       Cielo simulado de la versión anterior.
    */

    float skyAmount =
      clamp(
        V.y * 0.5 + 0.5,
        0.0,
        1.0
      );

    vec3 horizon =
      vec3(
        0.95,
        0.55,
        0.38
      );

    vec3 sky =
      vec3(
        0.35,
        0.58,
        0.72
      );

    vec3 reflectedSky =
      mix(
        horizon,
        sky,
        skyAmount
      );


    vec3 color =
      mix(
        baseWater,
        reflectedSky,
        fresnel * 0.72
      );


    /*
       ================================================
       BRILLO SOLAR
       ================================================
    */

    vec3 lightDir =
      normalize(
        vec3(-0.4, 1.0, 0.25)
      );

    vec3 H =
      normalize(
        lightDir + V
      );

    float specular =
      pow(
        max(dot(N, H), 0.0),
        80.0
      );

    color +=
      foamColor *
      specular *
      0.75;


    /*
       Claridad ligera en las crestas.
    */

    float crest =
      smoothstep(
        0.18,
        0.32,
        vWave
      );

    color +=
      foamColor *
      crest *
      0.08;


    /*
       En aguas someras damos un poquito más
       de luminosidad.

       Es deliberadamente sutil para evitar
       que parezca una piscina.
    */

    float shallowGlow =
      1.0 - depthFactor;

    color +=
      vec3(
        0.02,
        0.06,
        0.045
      ) *
      shallowGlow;


    gl_FragColor =
      vec4(
        color,
        0.96
      );
  }
`
    });


    /* =========================================================
       LOCOMOCIÓN QUEST
       ========================================================= */

    AFRAME.registerComponent('quest-locomotion', {
      init: function () {
        this.axis = [0, 0];

        this.el.addEventListener('thumbstickmoved', (event) => {
          this.axis = [
            event.detail.x,
            event.detail.y
          ];
        });
      },

      tick: function (time, delta) {

        const rig =
          document.querySelector('#rig');

        const camera =
          document.querySelector('#camera');

        if (!rig || !camera) return;

        const x =
          -(this.axis[0] || 0);

        const y =
          -(this.axis[1] || 0);

        if (
          Math.abs(x) < 0.15 &&
          Math.abs(y) < 0.15
        ) return;

        const direction =
          new THREE.Vector3();

        camera.object3D
          .getWorldDirection(direction);

        direction.y = 0;
        direction.normalize();

        const right =
          new THREE.Vector3();

        right
          .crossVectors(
            direction,
            new THREE.Vector3(0, 1, 0)
          )
          .normalize();

        const speed =
          2.0 * (delta / 1000);

        rig.object3D.position
          .addScaledVector(
            direction,
            -y * speed
          );

        rig.object3D.position
          .addScaledVector(
            right,
            x * speed
          );
      }
    });


    /* =========================================================
       GIRO SUAVE
       ========================================================= */

    AFRAME.registerComponent('smooth-turn', {

      init: function () {

        this.turnX = 0;

        this.el.addEventListener(
          'thumbstickmoved',
          (event) => {

            this.turnX =
              event.detail.x || 0;
          }
        );
      },

      tick: function (time, delta) {

        if (
          Math.abs(this.turnX) < 0.15
        ) return;

        const rig =
          document.querySelector('#rig');

        if (!rig) return;

        const turnSpeed = 180;

        const amount =
          -this.turnX *
          turnSpeed *
          (delta / 1000);

        rig.object3D.rotation.y +=
          THREE.MathUtils.degToRad(amount);
      }
    });

  </script>
</head>

<body>

<a-scene>

  <!-- ===============================================
       ISLA ORIGINAL
       =============================================== -->

  <a-cylinder
    position="0 -0.35 -5"
    radius="9"
    height="0.7"
    segments-radial="12"
    color="#D8BE83">
  </a-cylinder>

  <a-cylinder
    position="-2 -0.15 -6"
    radius="6"
    height="0.35"
    segments-radial="10"
    scale="1.25 1 0.75"
    color="#E2C98E">
  </a-cylinder>


  <!-- Cubo original -->

  <a-box
    position="0 1 -4"
    width="1"
    height="2"
    depth="1"
    color="#8B4513">
  </a-box>


  <!-- Esfera original -->

  <a-sphere
    position="2 1 -5"
    radius="0.75"
    color="#D8B46A">
  </a-sphere>


  <!-- ===============================================
       MAR EXPERIMENTAL
       ===============================================

       Es un plano subdividido porque necesitamos
       suficientes vértices para deformarlo y crear olas.
  -->

  <a-plane
    id="ocean"
    position="0 -0.72 -5"
    rotation="-90 0 0"

    width="160"
    height="160"

    segments-width="100"
    segments-height="100"

    material="
      shader: libertalia-water;
      deepColor: #063c52;
      waterColor: #087d91;
      foamColor: #d7f4ee;
      side: double;
      transparent: true">
  </a-plane>


  <!-- ===============================================
       ROCAS
       =============================================== -->

  <a-dodecahedron
    position="-7 0.6 -7"
    radius="2.2"
    scale="1 1.4 0.8"
    color="#55514A">
  </a-dodecahedron>

  <a-dodecahedron
    position="-6.5 0.3 -3"
    radius="1.5"
    scale="1.2 0.9 1"
    color="#666057">
  </a-dodecahedron>

  <a-dodecahedron
    position="7 0.7 -7"
    radius="2.4"
    scale="0.9 1.5 0.8"
    color="#504D48">
  </a-dodecahedron>

  <a-dodecahedron
    position="6.5 0.25 -2.5"
    radius="1.4"
    scale="1.3 0.8 1"
    color="#696158">
  </a-dodecahedron>

  <a-dodecahedron
    position="-4 0.15 -11"
    radius="1.2"
    scale="1.5 0.7 1"
    color="#5B5650">
  </a-dodecahedron>


  <!-- ===============================================
       PALMERA
       =============================================== -->

  <a-entity
    position="3 0 -7"
    rotation="0 0 -7">

    <a-cylinder
      position="0 2 0"
      radius="0.22"
      height="4"
      segments-radial="8"
      color="#76543A">
    </a-cylinder>

    <a-entity position="0 4 0">

      <a-cone
        position="0.9 0 0"
        rotation="0 0 -90"
        radius-bottom="0.55"
        radius-top="0.05"
        height="2.2"
        color="#376B3A">
      </a-cone>

      <a-cone
        position="-0.9 0 0"
        rotation="0 0 90"
        radius-bottom="0.55"
        radius-top="0.05"
        height="2.2"
        color="#376B3A">
      </a-cone>

      <a-cone
        position="0 0 -0.9"
        rotation="-90 0 0"
        radius-bottom="0.55"
        radius-top="0.05"
        height="2.2"
        color="#315F35">
      </a-cone>

      <a-cone
        position="0 0 0.9"
        rotation="90 0 0"
        radius-bottom="0.55"
        radius-top="0.05"
        height="2.2"
        color="#315F35">
      </a-cone>

    </a-entity>
  </a-entity>


  <!-- ===============================================
       CIELO E ILUMINACIÓN
       =============================================== -->

  <a-sky color="#E89A68"></a-sky>

  <a-light
    type="ambient"
    color="#FFD7B0"
    intensity="0.7">
  </a-light>

  <a-light
    type="directional"
    color="#FFF0D0"
    intensity="1.2"
    position="-4 8 2">
  </a-light>


  <!-- ===============================================
       JUGADOR VR
       =============================================== -->

  <a-entity
    id="rig"
    position="0 0 0">

    <a-camera
      id="camera"
      position="0 1.6 0"
      look-controls>
    </a-camera>

    <a-entity
      id="leftHand"
      hand-controls="hand: left"
      quest-locomotion>
    </a-entity>

    <a-entity
      id="rightHand"
      hand-controls="hand: right"
      smooth-turn>
    </a-entity>

  </a-entity>

</a-scene>

</body>
</html>
