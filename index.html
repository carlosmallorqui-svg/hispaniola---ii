<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hispaniola II - Prueba WebXR</title>

  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>
<script>
AFRAME.registerComponent('quest-locomotion', {
  init: function () {
    this.axis = [0, 0];

    this.el.addEventListener('thumbstickmoved', (event) => {
  this.axis = [event.detail.x, event.detail.y];
});
  },

  tick: function (time, delta) {
    const rig = document.querySelector('#rig');
    const camera = document.querySelector('#camera');

    if (!rig || !camera) return;

    const x = -(this.axis[0] || 0);
const y = -(this.axis[1] || 0);

    if (Math.abs(x) < 0.15 && Math.abs(y) < 0.15) return;

    const direction = new THREE.Vector3();
    camera.object3D.getWorldDirection(direction);
    direction.y = 0;
    direction.normalize();

    const right = new THREE.Vector3();
    right.crossVectors(direction, new THREE.Vector3(0, 1, 0)).normalize();

    const speed = 2.0 * (delta / 1000);

    rig.object3D.position.addScaledVector(direction, -y * speed);
    rig.object3D.position.addScaledVector(right, x * speed);
  }
});
      </script>
<body>

  <a-scene>
    
    <!-- Suelo -->
    <a-plane
      position="0 0 -4"
      rotation="-90 0 0"
      width="20"
      height="20"
      color="#CDBA87">
    </a-plane>

    <!-- Nuestro glorioso primer cubo 😂 -->
    <a-box
      position="0 1 -4"
      width="1"
      height="2"
      depth="1"
      color="#8B4513">
    </a-box>

    <!-- Una esfera para comprobar profundidad -->
    <a-sphere
      position="2 1 -5"
      radius="0.75"
      color="#D8B46A">
    </a-sphere>

    <!-- Una especie de mar provisional -->
    <a-plane
      position="0 -0.05 -14"
      rotation="-90 0 0"
      width="40"
      height="15"
      color="#287F9E">
    </a-plane>

    <!-- Cielo -->
    <a-sky color="#87CEEB"></a-sky>

  <!-- Jugador VR -->
<a-entity id="rig" position="0 0 0">

  <a-camera
    id="camera"
    position="0 1.6 0"
    look-controls>
  </a-camera>

  <a-entity
  id="leftHand"
  hand-controls="hand: left"
  quest-locomotion>
</a-entity>

  <a-entity
    id="rightHand"
    hand-controls="hand: right">
  </a-entity>

</a-entity>

  </a-scene>

</body>
</html>
